l="#ffffff" opacity="0.88" rx="5"/><text x="670" y="380" font-family="sans-serif" font-size="15" fill="#1c1c1c" text-anchor="middle" font-weight="bold">Полностью (для драки — можно)</text><rect x="227.2" y="17.0" width="434" height="26" fill="#ffffff" opacity="0.88" rx="5"/><text x="450" y="34" font-family="sans-serif" font-size="17" fill="#1c1c1c" text-anchor="middle" font-weight="bold">Одна и та же стычка — две степени показа</text><rect x="55.1" y="407.0" width="778" height="22" fill="#ffffff" opacity="0.88" rx="5"/><text x="450" y="420" font-family="sans-serif" font-size="13" fill="#1c1c1c" text-anchor="middle">Решение автора (вопрос 16): мрачное — обычная история для всех, намёками; драку можно полностью</text><rect x="298.5" y="420.0" width="291" height="24" fill="#ffffff" opacity="0.88" rx="5"/><text x="450.0" y="435" font-family="sans-serif" font-size="15" fill="#1c1c1c" text-anchor="middle" font-weight="bold">СХЕМА-ПРОБА · не финальный арт</text>
