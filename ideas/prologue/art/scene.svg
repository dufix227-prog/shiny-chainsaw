  <title id="title">Пролог: плоский антро-кот в рисованном макете</title>
  <desc id="desc">Оригинальная статичная иллюстрация, не игра и не рендер движка. Дорога, деревья, дом и грядки; условный кот на двух лапах. Окрас, детали и числа интерфейса — пробные.</desc>
