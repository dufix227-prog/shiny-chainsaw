[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*,evidence/*,README.md"
export_path="build/web/index.html"

[preset.0.options]
custom_template/debug="../../.tools/godot/web_nothreads_debug.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false

[preset.1]
name="Linux"
platform="Linux"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*,evidence/*,README.md"
export_path="build/linux/probe.x86_64"

[preset.1.options]
custom_template/debug="../../.tools/godot/linux_debug.x86_64"
binary_format/architecture="x86_64"
binary_format/embed_pck=true

[preset.2]
name="Windows"
platform="Windows Desktop"
runnable=false
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*,evidence/*,README.md"
export_path="build/windows/probe.exe"

[preset.2.options]
custom_template/debug="../../.tools/godot/windows_debug_x86_64.exe"
binary_format/architecture="x86_64"
binary_format/embed_pck=true
